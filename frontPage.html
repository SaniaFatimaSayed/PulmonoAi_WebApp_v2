<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="format.css">
    <title>Pulmono.AI</title>
</head>
<body>
    <h1>Pulmono.AI</h1>
    <h3>Know your lung function now!</h3>
    <hr>
    <div class="card">
      <img src="Pulmono.AI.png" alt="Avatar" style="width:100px; height:100px;">
      <form class="container">
          <label>Date of birth:</label>
          <input type="date" id="age" name="age" required>

          <label>Gender:</label>
          <select id="gender" required>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
          </select>

            <label>Height (cm):</label>
            <input type="number" id="height" name="height" min="0" max="999" required>

            <label>Weight (kg):</label>
            <input type="number" id="weight" name="weight" min="0" max="999" required>
            <br>
            <a href="recordVoice.html">
              <button type="button">Ready to record voice!</button>
            </a>
      </form>
    </div>
</body>
</html>
