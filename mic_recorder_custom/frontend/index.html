
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Source Sans Pro", -apple-system,
      BlinkMacSystemFont, sans-serif;
    background: transparent;
  }

  #wrap {
    padding: 4px 2px;
  }

  #rec-btn {
    width: 100%;
    height: 52px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid rgba(49, 51, 63, 0.2);
    background: #ffffff;
    color: #262730;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #rec-btn:hover {
    border-color: #ff4b4b;
    color: #ff4b4b;
  }

  #rec-btn.recording {
    background: #ff4b4b;
    color: white;
    border-color: #ff4b4b;
  }

  #rec-btn.saved {
    background: #21c354;
    color: white;
    border-color: #21c354;
  }

  #rec-btn.processing {
    background: #e6a23c;
    color: white;
    border-color: #e6a23c;
  }

  #rec-btn:disabled {
    cursor: default;
    opacity: 0.85;
  }

  #status-area {
    margin-top: 12px;
    display: none;
  }

  #timer-text {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  #progress-outer {
    background: #e6e6e6;
    border-radius: 6px;
    overflow: hidden;
    height: 12px;
    width: 100%;
  }

  #progress-inner {
    background: #4CAF50;
    height: 100%;
    width: 0%;
    transition: width 0.3s linear;
  }

  #error-text {
    color: #ff4b4b;
    font-size: 14px;
    margin-top: 8px;
    display: none;
  }
</style>
</head>

<body>

<div id="wrap">

  <button id="rec-btn">
    🔴 Start Recording
  </button>

  <div id="status-area">

    <div id="timer-text">
      ⏱ Recording...
    </div>

    <div id="progress-outer">
      <div id="progress-inner"></div>
    </div>

  </div>

  <div id="error-text"></div>

</div>

<script>

/* =====================================================
   STREAMLIT COMPONENT COMMUNICATION
===================================================== */

function sendToStreamlit(type, data) {

  var payload = Object.assign(
    {
      isStreamlitMessage: true,
      type: type
    },
    data || {}
  );

  window.parent.postMessage(payload, "*");
}


function streamlitSetComponentValue(value) {

  sendToStreamlit(
    "streamlit:setComponentValue",
    {
      value: value,
      dataType: "json"
    }
  );

}


function streamlitSetFrameHeight() {

  var height = document.documentElement.scrollHeight;

  sendToStreamlit(
    "streamlit:setFrameHeight",
    {
      height: height
    }
  );

}


/* =====================================================
   CONFIGURATION
===================================================== */

var RECORD_SECONDS = 30;

var recBtn = document.getElementById("rec-btn");
var statusArea = document.getElementById("status-area");
var timerText = document.getElementById("timer-text");
var progressInner = document.getElementById("progress-inner");
var errorText = document.getElementById("error-text");


/* =====================================================
   RECORDER VARIABLES
===================================================== */

var state = "idle";

var audioContext = null;
var sourceNode = null;
var processorNode = null;
var gainNode = null;
var mediaStream = null;

var pcmChunks = [];

var sampleRate = 44100;

var timerInterval = null;
var recordingStartTime = null;

var recordingId = 0;


/* =====================================================
   STREAMLIT INITIALISATION
===================================================== */

window.addEventListener("message", function(event) {

  if (!event.data) return;

  if (event.data.type === "streamlit:render") {

    var args = event.data.args || {};

    if (args.record_seconds) {

      RECORD_SECONDS = Number(args.record_seconds);

      if (state === "idle") {

        timerText.innerText =
          "⏱ Recording... " + RECORD_SECONDS + " s remaining";

      }

    }

  }

});


sendToStreamlit(
  "streamlit:componentReady",
  {
    apiVersion: 1
  }
);

setTimeout(streamlitSetFrameHeight, 100);


/* =====================================================
   ERROR HANDLING
===================================================== */

function showError(message) {

  errorText.innerText = message;

  errorText.style.display = "block";

  streamlitSetFrameHeight();

}


function hideError() {

  errorText.innerText = "";

  errorText.style.display = "none";

}


/* =====================================================
   START RECORDING
===================================================== */

async function startRecording() {

  if (state === "recording" || state === "processing") {
    return;
  }

  hideError();

  stopTimer();

  pcmChunks = [];

  recordingId++;

  var currentRecordingId = recordingId;

  state = "starting";

  recBtn.disabled = true;

  recBtn.innerText = "Connecting microphone...";

  try {

    /* Request microphone access */

    mediaStream = await navigator.mediaDevices.getUserMedia({

      audio: {

        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true

      }

    });

    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    await audioContext.resume();

    sampleRate = audioContext.sampleRate;

    sourceNode = audioContext.createMediaStreamSource(
      mediaStream
    );

    processorNode = audioContext.createScriptProcessor(
      4096,
      1,
      1
    );

    /* Prevent microphone feedback */

    gainNode = audioContext.createGain();

    gainNode.gain.value = 0;

    /* Capture microphone audio */

    processorNode.onaudioprocess = function(event) {

      if (state !== "recording") return;

      var channelData =
        event.inputBuffer.getChannelData(0);

      pcmChunks.push(
        new Float32Array(channelData)
      );

    };

    sourceNode.connect(processorNode);

    processorNode.connect(gainNode);

    gainNode.connect(audioContext.destination);

    /* Update UI */

    state = "recording";

    recBtn.disabled = false;

    recBtn.innerText = "⏹ Stop Recording";

    recBtn.classList.add("recording");

    recBtn.classList.remove("saved");
    recBtn.classList.remove("processing");

    statusArea.style.display = "block";

    recordingStartTime = Date.now();

    startTimer(currentRecordingId);

    streamlitSetFrameHeight();

  }

  catch(error) {

    state = "idle";

    recBtn.disabled = false;

    recBtn.innerText = "🔴 Start Recording";

    showError(
      "Microphone access failed: " + error.message
    );

    cleanupAudio();

  }

}


/* =====================================================
   RECORDING TIMER
===================================================== */

function startTimer(currentRecordingId) {

  stopTimer();

  var duration = RECORD_SECONDS * 1000;

  timerText.innerText =
    "⏱ Recording... " + RECORD_SECONDS + " s remaining";

  progressInner.style.width = "0%";

  progressInner.style.background = "#4CAF50";

  timerInterval = setInterval(function() {

    if (
      state !== "recording" ||
      currentRecordingId !== recordingId
    ) {

      stopTimer();

      return;

    }

    var elapsed = Date.now() - recordingStartTime;

    var remaining = Math.max(
      0,
      Math.ceil((duration - elapsed) / 1000)
    );

    var percentage = Math.min(
      100,
      (elapsed / duration) * 100
    );

    progressInner.style.width = percentage + "%";

    timerText.innerText =
      "⏱ Recording... " + remaining + " s remaining";

    /* Automatically stop at 30 seconds */

    if (elapsed >= duration) {

      stopRecording();

    }

  }, 200);

}


function stopTimer() {

  if (timerInterval !== null) {

    clearInterval(timerInterval);

    timerInterval = null;

  }

}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording() {

  if (state !== "recording") return;

  state = "processing";

  stopTimer();

  /* Stop microphone processing */

  if (processorNode) {

    processorNode.onaudioprocess = null;

    processorNode.disconnect();

  }

  if (sourceNode) {

    sourceNode.disconnect();

  }

  if (gainNode) {

    gainNode.disconnect();

  }

  /* Stop microphone tracks */

  if (mediaStream) {

    mediaStream.getTracks().forEach(function(track) {

      track.stop();

    });

  }

  /* Close audio context */

  if (audioContext) {

    var contextToClose = audioContext;

    audioContext = null;

    contextToClose.close().catch(function(err) {

      console.warn("Audio context cleanup:", err);

    });

  }

  /* Update interface */

  recBtn.disabled = true;

  recBtn.innerText = "Processing recording...";

  recBtn.classList.remove("recording");

  recBtn.classList.remove("saved");

  recBtn.classList.add("processing");

  timerText.innerText =
    "⏳ Preparing your recording...";

  progressInner.style.width = "100%";

  streamlitSetFrameHeight();

  /* Validate audio */

  if (pcmChunks.length === 0) {

    state = "idle";

    recBtn.disabled = false;

    recBtn.innerText = "🔴 Start Recording";

    recBtn.classList.remove("processing");

    showError(
      "No audio was captured. Please try recording again."
    );

    return;

  }

  try {

    /* Encode audio as WAV */

    var wavBlob = encodeWAV(
      pcmChunks,
      sampleRate
    );

    var reader = new FileReader();

    reader.onload = function() {

      try {

        var result = reader.result;

        if (!result || result.indexOf(",") === -1) {

          throw new Error("Invalid audio encoding.");

        }

        var base64data = result.split(",")[1];

        if (!base64data) {

          throw new Error("Audio data is empty.");

        }

        /* Build result for Python */

        var audioResult = {

          audio_base64: base64data,

          sample_rate: sampleRate,

          format: "wav"

        };

        /* Send audio to Streamlit */

        streamlitSetComponentValue(audioResult);

        /* Update recorder state */

        state = "stopped";

        recBtn.disabled = false;

        recBtn.innerText =
          "✅ Saved — Record Again";

        recBtn.classList.remove("processing");

        recBtn.classList.add("saved");

        timerText.innerText =
          "✅ Recording ready. You can continue.";

        progressInner.style.background = "#2e7d32";

        streamlitSetFrameHeight();

      }

      catch(error) {

        state = "stopped";

        recBtn.disabled = false;

        recBtn.innerText = "🔴 Try Again";

        recBtn.classList.remove("processing");

        showError(
          "Could not send recording: " + error.message
        );

      }

    };


    reader.onerror = function() {

      state = "stopped";

      recBtn.disabled = false;

      recBtn.innerText = "🔴 Try Again";

      recBtn.classList.remove("processing");

      showError("Unable to read the recorded audio.");

    };

    reader.readAsDataURL(wavBlob);

  }

  catch(error) {

    state = "stopped";

    recBtn.disabled = false;

    recBtn.innerText = "🔴 Try Again";

    recBtn.classList.remove("processing");

    showError(
      "Recording failed: " + error.message
    );

  }

}


/* =====================================================
   AUDIO CLEANUP
===================================================== */

function cleanupAudio() {

  stopTimer();

  if (processorNode) {

    processorNode.disconnect();

    processorNode = null;

  }

  if (sourceNode) {

    sourceNode.disconnect();

    sourceNode = null;

  }

  if (gainNode) {

    gainNode.disconnect();

    gainNode = null;

  }

  if (mediaStream) {

    mediaStream.getTracks().forEach(function(track) {

      track.stop();

    });

    mediaStream = null;

  }

  if (audioContext) {

    var context = audioContext;

    audioContext = null;

    context.close().catch(function() {});

  }

}


/* =====================================================
   RECORD BUTTON
===================================================== */

recBtn.addEventListener("click", function() {

  if (state === "idle") {

    startRecording();

  }

  else if (state === "recording") {

    stopRecording();

  }

  else if (state === "stopped") {

    /* Start a fresh recording */

    state = "idle";

    recBtn.classList.remove("saved");

    progressInner.style.width = "0%";

    statusArea.style.display = "block";

    startRecording();

  }

});


/* =====================================================
   WAV ENCODING - PCM 16 BIT MONO
===================================================== */

function encodeWAV(channelBuffers, sr) {

  var totalLength = 0;

  for (var i = 0; i < channelBuffers.length; i++) {

    totalLength += channelBuffers[i].length;

  }

  var samples = new Float32Array(totalLength);

  var offset = 0;

  for (var j = 0; j < channelBuffers.length; j++) {

    samples.set(channelBuffers[j], offset);

    offset += channelBuffers[j].length;

  }

  var buffer = new ArrayBuffer(
    44 + samples.length * 2
  );

  var view = new DataView(buffer);


  function writeString(view, offset, str) {

    for (var i = 0; i < str.length; i++) {

      view.setUint8(
        offset + i,
        str.charCodeAt(i)
      );

    }

  }


  function floatTo16BitPCM(view, offset, input) {

    for (
      var i = 0;
      i < input.length;
      i++, offset += 2
    ) {

      var s = Math.max(
        -1,
        Math.min(1, input[i])
      );

      view.setInt16(
        offset,
        s < 0 ? s * 0x8000 : s * 0x7FFF,
        true
      );

    }

  }


  /* WAV header */

  writeString(view, 0, "RIFF");

  view.setUint32(
    4,
    36 + samples.length * 2,
    true
  );

  writeString(view, 8, "WAVE");

  writeString(view, 12, "fmt ");

  view.setUint32(16, 16, true);

  view.setUint16(20, 1, true);

  view.setUint16(22, 1, true);

  view.setUint32(24, sr, true);

  view.setUint32(28, sr * 2, true);

  view.setUint16(32, 2, true);

  view.setUint16(34, 16, true);

  writeString(view, 36, "data");

  view.setUint32(
    40,
    samples.length * 2,
    true
  );

  floatTo16BitPCM(
    view,
    44,
    samples
  );

  return new Blob(
    [view],
    {
      type: "audio/wav"
    }
  );

}

</script>

</body>
</html>
